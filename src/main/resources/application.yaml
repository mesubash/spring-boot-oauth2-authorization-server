spring:
  application:
    name: spring-boot-oauth2-authorization-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oauth2_authorization_server}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 9000