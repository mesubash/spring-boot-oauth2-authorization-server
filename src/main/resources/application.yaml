spring:
  application:
    name: spring-boot-oauth2-authorization-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oauth2_authorization_server}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 9000
  forward-headers-strategy: framework


authorization-server:
  security:
    login:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}

  issuer: ${AUTHORIZATION_SERVER_ISSUER:http://localhost:9000}
  cors:
    allowed-origins: ${AUTHORIZATION_SERVER_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoint:
    web:
      exposure:
        include: health

    health:
      probes:
        enabled: true
        show-details: never
