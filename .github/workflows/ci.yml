name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  test:
    name: Build and Test

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven


      - name: Make Maven wrapper executable
        run: chmod +x mvnw


      - name: Verify Java
        run: |
          java -version
          ./mvnw -version


      - name: Run full test suite
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean verify


  docker:
    name: Build Docker Image

    runs-on: ubuntu-latest

    needs:
      - test

    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build container image
        run: |
          docker build \
            --tag spring-boot-oauth2-authorization-server:ci \
            .